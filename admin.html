<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة الأخبار</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="admin-container">
        <!-- قسم الإحصائيات -->
        <div class="stats-overview">
            <div class="stat-card">
                <h3>إجمالي الأخبار</h3>
                <p id="statTotalNews">0</p>
            </div>
            <div class="stat-card">
                <h3>الأخبار العاجلة</h3>
                <p id="statBreakingNews">0</p>
            </div>
            <div class="stat-card">
                <h3>الأخبار المثبتة</h3>
                <p id="statPinnedNews">0</p>
            </div>
            <div class="stat-card">
                <h3>أخبار اليوم</h3>
                <p id="statTodayNews">0</p>
            </div>
        </div>

        <!-- أدوات التصفية والبحث وإضافة خبر -->
        <div class="news-controls">
            <div class="news-search">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث عن خبر بالعنوان أو المحتوى...">
            </div>

            <div class="news-filters">
                <button class="filter active">الكل</button>
                <button class="filter">🚨 عاجل</button>
                <button class="filter">📌 مثبت</button>
                <button class="filter">📰 عام</button>
                <button class="filter">💰 اقتصادي</button>
            </div>

            <button id="openNewsForm" class="btn btn-primary">➕ إضافة خبر جديد</button>
        </div>

        <!-- نافذة إضافة خبر -->
        <div id="addNewsPanel" class="add-news-panel" style="display: none;">
            <div class="panel-header">
                <h2>إضافة خبر جديد</h2>
                <button id="closeNewsForm" class="close-btn">&times;</button>
            </div>
            
            <form class="news-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="newsTitle">عنوان الخبر</label>
                    <input type="text" id="newsTitle" required placeholder="أدخل عنوان الخبر">
                </div>

                <div class="form-group">
                    <label for="newsContent">محتوى الخبر</label>
                    <textarea id="newsContent" rows="4" required placeholder="أدخل تفاصيل الخبر"></textarea>
                </div>

                <div class="form-group">
                    <label>التصنيف</label>
                    <div class="radio-group">
                        <label><input type="radio" name="category" value="general" checked> عام</label>
                        <label><input type="radio" name="category" value="breaking"> عاجل</label>
                        <label><input type="radio" name="category" value="economic"> اقتصادي</label>
                        <label><input type="radio" name="category" value="technology"> تقني</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newsImage">صورة الخبر</label>
                    <input type="file" id="newsImage" accept="image/*">
                </div>

                <div class="form-group checkboxes">
                    <label><input type="checkbox" id="breakingNews"> خبر عاجل</label>
                    <label><input type="checkbox" id="pinnedNews"> تثبيت الخبر في الأعلى</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">حفظ ونشر</button>
                    <button type="button" id="cancelNewsForm" class="btn btn-secondary">إلغاء</button>
                </div>
            </form>
        </div>

        <!-- جدول الأخبار -->
        <div class="table-responsive">
            <table class="news-table">
                <thead>
                    <tr>
                        <th>الخبر</th>
                        <th>التصنيف</th>
                        <th>الحالة</th>
                        <th>التاريخ</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="newsTableBody">
                    <!-- يتم تفريغ الجدول ليُبنى ديناميكيًا بواسطة JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
